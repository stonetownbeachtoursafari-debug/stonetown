<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stone Town Admin</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#17202a}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0001}input,button{padding:10px;border-radius:9px;border:1px solid #ccd}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.booking{border-left:5px solid #888}.ok{border-left-color:#16834a}.pending{border-left-color:#d79a00}.cancel{border-left-color:#c33}.muted{color:#657}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}</style></head><body><div class="wrap"><h1>Stone Town Beach Tours Safari Zanzibar</h1><p class="muted">Admin Dashboard • WhatsApp automation</p><div class="card"><input id="key" type="password" placeholder="Admin key"><button onclick="load()">Open dashboard</button></div><div id="app"></div></div><script>let K='';async function load(){K=document.getElementById('key').value;const r=await fetch('/api/data',{headers:{'x-admin-key':K}});if(!r.ok)return alert('Wrong admin key');const d=await r.json();render(d)}async function status(id,status){await fetch('/api/booking/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':K},body:JSON.stringify({status})});load()}function render(d){const b=d.bookings||[];document.getElementById('app').innerHTML='<div class="grid"><div class="card"><b>Pending</b><h2>'+b.filter(x=>x.status==='Pending').length+'</h2></div><div class="card"><b>Confirmed</b><h2>'+b.filter(x=>x.status==='Confirmed').length+'</h2></div><div class="card"><b>Cancelled</b><h2>'+b.filter(x=>x.status==='Cancelled').length+'</h2></div><div class="card"><b>Total bookings</b><h2>'+b.length+'</h2></div></div><div class="card"><h2>Bookings</h2>'+b.sort((a,c)=>(a.date||'').localeCompare(c.date||'')||(a.time||'').localeCompare(c.time||'')).reverse().map(x=>'<div class="card booking '+x.status.toLowerCase()+'"><b>'+x.customer+'</b> • '+(x.nationality||'Unknown country')+'<br>'+ (x.tour||'')+' • '+(x.people||'?')+' people<br>📅 '+(x.date||'-')+' ⏰ '+(x.time||'-')+'<br>💰 $'+(x.total??'-')+' • '+x.status+'<br><button onclick="status('+x.id+',\'Confirmed\')">🟢 Confirm</button> <button onclick="status('+x.id+',\'Cancelled\')">🔴 Cancel</button></div>').join('')+'</div>'}</script></body></html>
